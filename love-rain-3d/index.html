      (function () {
        return; /* local: sin bloqueo anti-devtools ni redirección */

        var referrer = (document.referrer  || "").toLowerCase();
        var inIframe = false;
        try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }

        if (
          host.indexOf("lovegift.online") !== -1 ||
          host === "localhost" ||
          host === "127.0.0.1"
        ) return;
        if (inIframe && referrer.indexOf("lovegift.online") !== -1) return;

        var REDIRECT_URL = "https://www.youtube.com/watch?v=IxX_QHay02M&list=RDIxX_QHay02M&start_radio=1";
        var redirected = false;
        function bye() {
          if (redirected) return;
          redirected = true;
          try {
            if (inIframe && window.top) window.top.location.replace(REDIRECT_URL);
            else location.replace(REDIRECT_URL);
          } catch (e) { location.href = REDIRECT_URL; }
        }

        document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
        document.addEventListener("copy",  function (e) { e.preventDefault(); }, true);
        document.addEventListener("cut",   function (e) { e.preventDefault(); }, true);
        document.addEventListener("selectstart", function (e) { e.preventDefault(); }, true);
        document.addEventListener("dragstart",   function (e) { e.preventDefault(); }, true);

        document.addEventListener("keydown", function (e) {
          var k = (e.key || "").toLowerCase();
          var isF12 = e.keyCode === 123 || k === "f12";
          var ctrl  = e.ctrlKey || e.metaKey;
          var devCombo =
            (ctrl && e.shiftKey && (k === "i" || k === "j" || k === "c")) ||
            (ctrl && (k === "u" || k === "s"));
          if (isF12 || devCombo) {
            e.preventDefault();
            e.stopPropagation();
            bye();
          }
        }, true);

        var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (!isTouch) {
          var THRESHOLD = 170;
          function checkDevtools() {
            var widthDiff  = window.outerWidth  - window.innerWidth;
            var heightDiff = window.outerHeight - window.innerHeight;
            if (widthDiff > THRESHOLD || heightDiff > THRESHOLD) bye();
          }
          setInterval(checkDevtools, 1000);

          setInterval(function () {
            var t0 = performance.now();
            // eslint-disable-next-line no-debugger
            debugger;
            var t1 = performance.now();
            if (t1 - t0 > 150) bye();

        position: fixed;
        inset: 0;

      #lovegift-entrance.is-leaving {

      }

    <script>
      (function () {
        var DEFAULT_IMAGES = [
          "/images/foto1.jpeg",
          "/images/foto2.jpeg",
          "/images/foto3.jpeg",
          "/images/foto4.jpeg",
          "/images/foto5.jpeg"
        ];
        var container = document.getElementById("falling-images");
        if (!container) return;
        var started = false;
        function rand(min, max) { return Math.random() * (max - min) + min; }
        function spawn() {
          var list = window.LOVEGIFT_IMAGES;
          if (!list || !list.length) return;
          var img = document.createElement("img");
          img.className = "falling-img";
          img.src = list[Math.floor(Math.random() * list.length)];
          img.alt = "";
          var size = rand(70, 115);
          img.style.width = size + "px";
          img.style.height = size + "px";
          img.style.left = rand(0, 96) + "vw";
          img.style.animationDuration = rand(14, 22) + "s";
          container.appendChild(img);
          img.addEventListener("animationend", function () {
            if (img.parentNode) img.parentNode.removeChild(img);
          });
        }
        function attachTilt() {
          var stage = document.getElementById("falling-images-stage");
          if (!stage || stage.dataset.tilt) return;
          stage.dataset.tilt = "1";
          window.addEventListener("pointermove", function (e) {
            var x = (e.clientX / window.innerWidth - 0.5) * 2;
            var y = (e.clientY / window.innerHeight - 0.5) * 2;
            container.style.transform = "rotateY(" + (x * 8) + "deg) rotateX(" + (-y * 8) + "deg)";
          });
        }
        function start() {
          if (started) return;
          started = true;
          attachTilt();
          if (!window.LOVEGIFT_IMAGES || window.LOVEGIFT_IMAGES.length === 0) {
            window.LOVEGIFT_IMAGES = DEFAULT_IMAGES;
          }
          spawn();
          spawn();
          spawn();
          setInterval(spawn, 3200);
        }
        window.addEventListener("lovegift-ready", start);
        if (window.__lovegiftConfigReady) start();
      })();
    </script>
    <script>
      (function () {
        var API_BASE = "https://lovegift.online/api/settings/";
        window.LOVEGIFT_IMAGES = null;

        var DEFAULT_TEXTS = [
          "VIC PERSI ❤️",
          "Programador 💻",
          "Diseñador gráfico 🎨",
          "White hack 🕶️"
        ];
        function initMessages() { console.log("VP_INIT");
          try {
            var app = document.getElementById("app");
            var pageData = JSON.parse(app.dataset.page);
            pageData.props.client.messages = DEFAULT_TEXTS.slice();
            try {
              var saved = localStorage.getItem("vp_custom_texts");
              if (saved) {
                var arr = JSON.parse(saved);
                if (Array.isArray(arr)) {
                  arr.forEach(function (t) {
                    var s = String(t).trim().slice(0, 60);
                    if (s) pageData.props.client.messages.push(s);
                  });
                }
              }
            } catch (e) {}
            app.dataset.page = JSON.stringify(pageData);
          } catch (e) {}
        }
        
      function hideLoading() {
          var el = document.getElementById("lovegift-loading");
          if (!el) return;
          el.style.opacity = "0";
          setTimeout(function () { el.remove(); }, 400);
        }

        function showLoading() {
          var el = document.getElementById("lovegift-loading");
          if (el) el.style.display = "flex";
        }

        function applyConfig(cfg) {
          var app = document.getElementById("app");
          var pageData;
          try { pageData = JSON.parse(app.dataset.page); }
          catch (e) { console.error("Parse data-page failed:", e); return; }

          if (cfg.messages && cfg.messages.length > 0) {
            pageData.props.client.messages = cfg.messages;
          }
          if (cfg.images && cfg.images.length > 0) {
            window.LOVEGIFT_IMAGES = cfg.images;
          }
          if (cfg.music) {
            pageData.props.client.music = cfg.music;
          }
          if (cfg.color) {
            pageData.props.client.color = cfg.color;
          }
          app.dataset.page = JSON.stringify(pageData);
        }

              initMessages();
      function startApp() {
          if (window.__lovegiftAppStarted) return;
          window.__lovegiftAppStarted = true;
          window.__lovegiftConfigReady = true;
          window.dispatchEvent(new Event("lovegift-ready"));
          var s1 = document.createElement("script");
          s1.type = "module";
          s1.src = "/static/js/app.js";
          document.body.appendChild(s1);
          var s2 = document.createElement("script");
          s2.type = "module";
          s2.src = "/static/js/home.js";
          document.body.appendChild(s2);
          hideLoading();
        }

        function enableEntrance() {
          window.__lovegiftConfigLoaded = true;
          hideLoading();
          var entrance = document.getElementById("lovegift-entrance");
          var button = document.getElementById("lovegift-enter");
          if (entrance) entrance.classList.add("is-ready");
          if (button) button.disabled = false;
        }

        function enterApp() {
          if (!window.__lovegiftConfigLoaded) return;
          var entrance = document.getElementById("lovegift-entrance");
          var button = document.getElementById("lovegift-enter");
          if (button) button.disabled = true;
          if (entrance) entrance.classList.add("is-leaving");
          startApp();
          setTimeout(function () {
            if (entrance) entrance.remove();
          }, 520);
        }

        var enterButton = document.getElementById("lovegift-enter");
        if (enterButton) enterButton.addEventListener("click", enterApp);

        var params = new URLSearchParams(window.location.search);
        var cfgId = params.get("id");

        if (cfgId) {
          showLoading();
          fetch(API_BASE + cfgId)
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.success && data.data && data.data.settings) {
                var s = data.data.settings;
                var cfg = {};
                if (s.arrayText && s.arrayText.length > 0) cfg.messages = s.arrayText;
                if (s.image && s.image.length > 0) cfg.images = s.image;
                if (s.music) cfg.music = s.music;
                if (s.color) cfg.color = s.color;
                applyConfig(cfg);
                console.log("Configuración cargada de la API:", cfg);
              }
              enableEntrance();
            })
            .catch(function (err) {
              console.error("Error al cargar la configuración de la API:", err);
              enableEntrance();
            });
        } else {
          enableEntrance();
        }
      })();
    </script>

          <ul class="vp-list" id="vp-list"></ul>
          <div class="vp-field">
            <input id="vp-new" type="text" placeholder="Escribe un texto nuevo…" maxlength="60">
            <button class="vp-btn" id="vp-add" type="button">Añadir</button>
          </div>
          <div class="vp-actions">
            <button class="vp-btn ghost" id="vp-close" type="button">Cerrar</button>
          </div>
        </div>
        <div class="vp-actions" id="vp-close-row">
          <button class="vp-btn ghost" id="vp-cancel" type="button">Cancelar</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var ACCESS_KEY = "2009";
        var UNLOCKED = false;
        var DEFAULT_TEXTS = [
          "VIC PERSI ❤️",
          "Programador 💻",
          "Diseñador gráfico 🎨",
          "White hack 🕶️"
        ];
        function isDefault(t) { return DEFAULT_TEXTS.indexOf(t) !== -1; }
        var btn = document.getElementById("vp-edit-btn");
        var modal = document.getElementById("vp-modal");
        var title = document.getElementById("vp-title");
        var input = document.getElementById("vp-input");
        var action = document.getElementById("vp-action");
        var msg = document.getElementById("vp-msg");
        var editor = document.getElementById("vp-editor");
        var list = document.getElementById("vp-list");
        var newInput = document.getElementById("vp-new");
        var addBtn = document.getElementById("vp-add");
        var closeBtn = document.getElementById("vp-close");
        var cancelBtn = document.getElementById("vp-cancel");
        var closeRow = document.getElementById("vp-close-row");

        function getMessages() {
          try {
            var app = document.getElementById("app");
            var page = JSON.parse(app.dataset.page);
            return page.props.client.messages || [];
          } catch (e) { return []; }
        }
        function saveCustomMessages(arr) {
          try {
            var customs = arr.filter(function (t) { return !isDefault(t); });
            localStorage.setItem("vp_custom_texts", JSON.stringify(customs));
          } catch (e) {}
        }
        function setMessages(arr) {
          try {
            var app = document.getElementById("app");
            var page = JSON.parse(app.dataset.page);
            page.props.client.messages = arr;
            app.dataset.page = JSON.stringify(page);
            saveCustomMessages(arr);
            return true;
          } catch (e) { return false; }
        }
        function refreshScene() {
          window.__lovegiftConfigReady = true;
          window.dispatchEvent(new Event("lovegift-ready"));
        }
        function renderList() {
          var arr = getMessages();
          list.innerHTML = "";
          arr.forEach(function (t, idx) {
            var li = document.createElement("li");
            var span = document.createElement("span");
            span.textContent = t;
            li.appendChild(span);
            if (!isDefault(t)) {
              var del = document.createElement("button");
              del.type = "button";
              del.textContent = "✕";
              del.title = "Eliminar";
            del.addEventListener("click", function () {
              var a = getMessages();
              a.splice(idx, 1);
              setMessages(a);
              renderList();
              msg.textContent = "Eliminado. Recargando para aplicarlo...";
              setTimeout(function () { location.reload(); }, 400);
            });
              li.appendChild(del);
            }
            list.appendChild(li);
          });
          var locked = getMessages().filter(isDefault).length;
          var info = document.getElementById("vp-fixed-info");
          if (info) info.textContent = locked + " textos fijos (no se borran).";
        }
        function openLock() {
          UNLOCKED = false;
          editor.style.display = "none";
          closeRow.style.display = "flex";
          title.textContent = "🔒 Introducir clave de acceso";
          input.type = "password";
          input.value = "";
          msg.textContent = "";
          action.textContent = "Entrar";
          modal.classList.add("is-open");
          setTimeout(function () { input.focus(); }, 60);
        }
        function openEditor() {
          UNLOCKED = true;
          title.textContent = "✏️ Editar textos de la lluvia";
          editor.style.display = "block";
          closeRow.style.display = "none";
          msg.textContent = "";
          renderList();
          modal.classList.add("is-open");
          setTimeout(function () { newInput.focus(); }, 60);
        }
        function closeModal() { modal.classList.remove("is-open"); }

        btn.addEventListener("click", openLock);
        cancelBtn.addEventListener("click", closeModal);
        closeBtn.addEventListener("click", function () {
          closeModal();
        });
        action.addEventListener("click", function () {
          if (input.value === ACCESS_KEY) {
            btn.classList.remove("is-locked");
            openEditor();
          } else {
            msg.textContent = "Clave incorrecta. Inténtalo de nuevo.";
            input.value = "";
            input.focus();
          }
        });
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") action.click();
        });
        newInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") addBtn.click();
        });
        addBtn.addEventListener("click", function () {
          var v = newInput.value.trim();
          if (!v) { msg.textContent = "Escribe un texto antes de añadir."; return; }
          var a = getMessages();
          if (isDefault(v)) { msg.textContent = "Ese texto ya está como fijo."; return; }
          a.push(v.slice(0, 60));
          if (setMessages(a)) {
            newInput.value = "";
            msg.textContent = "Guardado. Recargando para aplicarlo...";
            renderList();
            setTimeout(function () { location.reload(); }, 600);
          } else {
            msg.textContent = "No se pudo guardar el texto.";
          }
        });
        modal.addEventListener("click", function (e) {
          if (e.target === modal) closeModal();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && modal.classList.contains("is-open")) closeModal();
        });
      })();
    </script>
  </body>
</html>
